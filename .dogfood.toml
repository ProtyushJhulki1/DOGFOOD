[portal]
base_url = "http://localhost:8080"

[tiers]
claimed = ["T1", "T2"]
pitch = "A self-hostable hackathon submission and judging platform with backend-enforced role isolation."

[auth]
organizer   = "X-Auth-Token: org_fixed_token"
judge_a     = "X-Auth-Token: jdga_fixed_token"
judge_b     = "X-Auth-Token: jdgb_fixed_token"
participant = "X-Auth-Token: prt_fixed_token"

[routes]
gallery      = "/projects"
submit       = "/projects/new"
judge_scores = "/api/judge/scores"
peer_scores  = "/api/judge/scores/peer?judge=jdg_01"
csv_export   = "/api/export.csv"